<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap');

:root {
  --bg: #1c1b19;
  --surface: #242220;
  --surface-2: #2d2a26;
  --ink: #f1ece0;
  --muted: #8f8977;
  --muted-2: #6b6659;
  --gold: #c9a44c;
  --gold-dim: #8a7238;
  --teal: #6b9088;
  --rust: #b5654a;
  --border: #3a362f;
}

#ledger-root * { box-sizing: border-box; }

#ledger-root {
  font-family: 'Work Sans', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 0;
  display: flex;
  justify-content: center;
}

.ledger-shell {
  width: 100%;
  max-width: 480px;
  padding: 28px 18px 40px;
  position: relative;
}

.ledger-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.ledger-title {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 28px;
  letter-spacing: -0.01em;
  line-height: 1;
  color: var(--ink);
}

.ledger-sub {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
  letter-spacing: 0.02em;
}

.ledger-count {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 22px;
  color: var(--gold);
  text-align: right;
  white-space: nowrap;
}

.ledger-count small {
  display: block;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--muted-2);
  font-weight: 400;
  margin-top: 2px;
}

.name-banner {
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  margin-bottom: 18px;
  display: flex;
  gap: 8px;
  align-items: center;
}

.name-banner input {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--ink);
  padding: 9px 10px;
  font-family: 'Work Sans', sans-serif;
  font-size: 14px;
  outline: none;
  min-width: 0;
}

.name-banner input:focus { border-color: var(--gold-dim); }

.name-banner button {
  background: var(--gold);
  color: #1c1b19;
  border: none;
  border-radius: 3px;
  padding: 9px 14px;
  font-family: 'Work Sans', sans-serif;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}

.add-row {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
}

.add-row input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--ink);
  padding: 13px 14px;
  font-family: 'Work Sans', sans-serif;
  font-size: 15px;
  outline: none;
  min-width: 0;
}

.add-row input::placeholder { color: var(--muted-2); }
.add-row input:focus { border-color: var(--gold-dim); }

.add-row button {
  background: var(--gold);
  color: #1c1b19;
  border: none;
  border-radius: 4px;
  width: 46px;
  min-width: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 22px;
  line-height: 1;
}

.add-row button:disabled { opacity: 0.4; cursor: default; }

.list-wrap { position: relative; }

.item-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 2px;
  border-bottom: 1px solid var(--border);
}

.checkbox {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border: 1.5px solid var(--muted);
  border-radius: 3px;
  margin-top: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: transparent;
  transition: border-color 0.15s ease;
  color: #1c1b19;
  font-size: 13px;
  font-weight: 700;
}

.checkbox.done {
  background: var(--teal);
  border-color: var(--teal);
}

.item-body { flex: 1; min-width: 0; }

.item-text {
  font-size: 15.5px;
  line-height: 1.4;
  word-break: break-word;
}

.item-text.done {
  color: var(--muted-2);
  text-decoration: line-through;
  text-decoration-color: var(--muted-2);
}

.item-meta {
  font-family: 'Space Mono', monospace;
  font-size: 10.5px;
  color: var(--muted-2);
  margin-top: 4px;
}

.del-btn {
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--muted-2);
  cursor: pointer;
  padding: 4px;
  margin-top: -2px;
  font-size: 16px;
}

.del-btn:hover { color: var(--rust); }

.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 12.5px;
  line-height: 1.7;
}

.stamp {
  position: absolute;
  top: 8px;
  right: -4px;
  width: 92px;
  height: 92px;
  border: 3px solid var(--gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: rotate(-14deg);
  opacity: 0.9;
  pointer-events: none;
  animation: stamp-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.stamp::before {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid var(--gold);
  border-radius: 50%;
}

.stamp span {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 17px;
  color: var(--gold);
  letter-spacing: 0.03em;
}

@keyframes stamp-in {
  0% { transform: rotate(-14deg) scale(0.4); opacity: 0; }
  100% { transform: rotate(-14deg) scale(1); opacity: 0.9; }
}

.footer-note {
  margin-top: 26px;
  font-family: 'Space Mono', monospace;
  font-size: 10.5px;
  color: var(--muted-2);
  text-align: center;
  line-height: 1.6;
}

.sync-btn {
  background: none;
  border: none;
  color: var(--muted-2);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: 'Space Mono', monospace;
  font-size: 10.5px;
  padding: 0;
  margin-top: 6px;
}

.sync-icon { display: inline-block; transition: transform 0.2s; }
.sync-icon.spin { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<div id="ledger-root">
  <div class="ledger-shell">
    <div class="stamp" id="stamp" style="display:none;"><span>완료</span></div>

    <div class="ledger-header">
      <div>
        <div class="ledger-title">할 일 목록</div>
        <div class="ledger-sub">모두가 같은 목록을 봅니다</div>
      </div>
      <div class="ledger-count">
        <span id="count-text">0/0</span>
        <small>완료됨</small>
      </div>
    </div>

    <div class="name-banner" id="name-banner" style="display:none;">
      <input id="name-input" placeholder="이름을 입력하세요 (선택)" />
      <button id="name-save-btn">저장</button>
    </div>

    <div class="add-row">
      <input id="todo-input" placeholder="할 일을 입력하고 Enter" />
      <button id="add-btn" disabled>+</button>
    </div>

    <div class="list-wrap" id="list-wrap">
      <div class="empty-state">불러오는 중...</div>
    </div>

    <div class="footer-note">
      이 화면 링크를 공유하면 같은 목록을 함께 사용할 수 있어요
      <br />
      <button class="sync-btn" id="sync-btn">
        <span class="sync-icon" id="sync-icon">⟳</span>
        새로고침
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  let name = null;
  let todos = [];
  let pollTimer = null;

  const nameBanner = document.getElementById("name-banner");
  const nameInput = document.getElementById("name-input");
  const nameSaveBtn = document.getElementById("name-save-btn");
  const todoInput = document.getElementById("todo-input");
  const addBtn = document.getElementById("add-btn");
  const listWrap = document.getElementById("list-wrap");
  const countText = document.getElementById("count-text");
  const stamp = document.getElementById("stamp");
  const syncBtn = document.getElementById("sync-btn");
  const syncIcon = document.getElementById("sync-icon");

  function timeAgo(ts) {
    const diff = Date.now() - ts;
    const min = Math.floor(diff / 60000);
    if (min < 1) return "방금";
    if (min < 60) return min + "분 전";
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + "시간 전";
    const day = Math.floor(hr / 24);
    return day + "일 전";
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const doneCount = todos.filter((t) => t.done).length;
    const total = todos.length;
    countText.textContent = doneCount + "/" + total;
    stamp.style.display = total > 0 && doneCount === total ? "flex" : "none";

    if (total === 0) {
      listWrap.innerHTML =
        '<div class="empty-state">아직 할 일이 없습니다.<br />위 입력창에 첫 항목을 추가해 보세요.</div>';
      return;
    }

    const sorted = todos.slice().sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return a.createdAt - b.createdAt;
    });

    listWrap.innerHTML = sorted
      .map((t) => {
        const metaText = t.done
          ? escapeHtml(t.completedBy || "익명") + "님이 완료 · " + timeAgo(t.createdAt)
          : escapeHtml(t.addedBy) + "님이 추가 · " + timeAgo(t.createdAt);
        return (
          '<div class="item-row" data-id="' +
          t.id +
          '">' +
          '<div class="checkbox ' +
          (t.done ? "done" : "") +
          '" data-action="toggle">' +
          (t.done ? "✓" : "") +
          "</div>" +
          '<div class="item-body">' +
          '<div class="item-text ' +
          (t.done ? "done" : "") +
          '">' +
          escapeHtml(t.text) +
          "</div>" +
          '<div class="item-meta">' +
          metaText +
          "</div>" +
          "</div>" +
          '<button class="del-btn" data-action="delete">✕</button>' +
          "</div>"
        );
      })
      .join("");
  }

  async function loadTodos() {
    try {
      const result = await window.storage.get("todos", true);
      const parsed = result ? JSON.parse(result.value) : [];
      todos = Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      todos = [];
    }
    render();
  }

  async function saveTodos(next) {
    todos = next;
    render();
    try {
      const result = await window.storage.set("todos", JSON.stringify(next), true);
      if (!result) console.error("할 일 저장 실패: 결과 없음");
    } catch (e) {
      console.error("저장 실패", e);
    }
  }

  async function loadName() {
    try {
      const personal = await window.storage.get("my-name", false);
      if (personal && personal.value) {
        name = personal.value;
        nameBanner.style.display = "none";
      } else {
        nameBanner.style.display = "flex";
      }
    } catch (e) {
      nameBanner.style.display = "flex";
    }
  }

  async function saveName() {
    const trimmed = nameInput.value.trim();
    if (!trimmed) return;
    nameSaveBtn.disabled = true;
    nameSaveBtn.textContent = "저장 중...";
    try {
      const result = await window.storage.set("my-name", trimmed, false);
      if (!result) throw new Error("저장 결과 없음");
      name = trimmed;
      nameBanner.style.display = "none";
      render();
    } catch (e) {
      console.error("이름 저장 실패", e);
      nameSaveBtn.textContent = "저장";
      nameSaveBtn.disabled = false;
      showNameError();
      return;
    }
    nameSaveBtn.textContent = "저장";
    nameSaveBtn.disabled = false;
  }

  function showNameError() {
    let err = document.getElementById("name-error");
    if (!err) {
      err = document.createElement("div");
      err.id = "name-error";
      err.style.cssText =
        "font-family:'Space Mono',monospace;font-size:10.5px;color:#b5654a;margin-top:8px;";
      nameBanner.insertAdjacentElement("afterend", err);
    }
    err.textContent =
      "저장에 실패했어요. 이 화면이 클로드 아티팩트 미리보기(또는 공유 링크)로 열려 있는지 확인해 주세요 — 파일을 다운로드해 직접 연 경우에는 저장 기능이 동작하지 않아요.";
  }

  function checkStorageAvailable() {
    if (!window.storage || typeof window.storage.get !== "function") {
      listWrap.innerHTML =
        '<div class="empty-state">저장 기능을 쓸 수 없어요.<br />이 파일을 다운로드해서 직접 열면 목록 저장이 동작하지 않습니다.<br />클로드의 아티팩트 미리보기 화면이나, 공유된 링크로 열어주세요.</div>';
      nameBanner.style.display = "none";
      todoInput.disabled = true;
      addBtn.disabled = true;
      return false;
    }
    return true;
  }

  async function addTodo() {
    const text = todoInput.value.trim();
    if (!text) return;
    const next = todos.concat([
      {
        id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
        text: text,
        done: false,
        addedBy: name || "익명",
        completedBy: null,
        createdAt: Date.now(),
      },
    ]);
    todoInput.value = "";
    addBtn.disabled = true;
    await saveTodos(next);
  }

  async function toggleTodo(id) {
    const next = todos.map((t) => {
      if (t.id !== id) return t;
      const willBeDone = !t.done;
      return {
        ...t,
        done: willBeDone,
        completedBy: willBeDone ? name || "익명" : null,
      };
    });
    await saveTodos(next);
  }

  async function deleteTodo(id) {
    const next = todos.filter((t) => t.id !== id);
    await saveTodos(next);
  }

  nameSaveBtn.addEventListener("click", saveName);
  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") saveName();
  });

  todoInput.addEventListener("input", () => {
    addBtn.disabled = !todoInput.value.trim();
  });
  todoInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addTodo();
  });
  addBtn.addEventListener("click", addTodo);

  listWrap.addEventListener("click", (e) => {
    const row = e.target.closest(".item-row");
    if (!row) return;
    const id = row.getAttribute("data-id");
    const action = e.target.getAttribute("data-action");
    if (action === "toggle") toggleTodo(id);
    if (action === "delete") deleteTodo(id);
  });

  syncBtn.addEventListener("click", async () => {
    syncIcon.classList.add("spin");
    await loadTodos();
    setTimeout(() => syncIcon.classList.remove("spin"), 400);
  });

  (async function init() {
    if (!checkStorageAvailable()) return;
    await loadName();
    await loadTodos();
    pollTimer = setInterval(loadTodos, 4000);
  })();
})();
</script>
